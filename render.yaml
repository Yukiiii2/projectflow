services:
  - type: web
    name: projectflow
    runtime: node
    plan: free
    region: singapore
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm --prefix backend ci --include=dev && npm run build:all && npm prune --omit=dev && npm --prefix backend prune --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: INVITATION_TTL_HOURS
        value: "168"
      - key: VERIFICATION_TTL_MINUTES
        value: "1440"
      - key: PASSWORD_RESET_TTL_MINUTES
        value: "60"
      - key: INVITATION_DELIVERY
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_OUTBOX_KEY
        sync: false
      - key: INVITATION_FROM
        sync: false
      - key: LOG_LEVEL
        value: info
